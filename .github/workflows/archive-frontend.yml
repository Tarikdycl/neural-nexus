name: Archive frontend build

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/archive-frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/archive-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vite-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Validate React and bundle
        run: npm run build
